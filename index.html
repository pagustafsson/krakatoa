<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krakatoa Smoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Unbounded:wght@300;400&display=swap">
<style>
/* Layout: full-bleed WebGL smoke canvas; a slim glass control rail docked top-right; render HUD bottom-left. One dark look by design. */
:root {
  color-scheme: dark;
  --void: #030409;
  --glass: rgba(9, 11, 19, 0.68);
  --glass-edge: rgba(170, 190, 255, 0.09);
  --track: rgba(170, 185, 230, 0.16);
  --ink: #e7eaf3;
  --ink-dim: #8c93a8;
  --ink-faint: #596075;
  --accent: #b6ff5a;
  --font-display: "Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Geist", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--ink);
  font: 400 12.5px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#gl:focus { outline: none; }

.rail {
  position: fixed; z-index: 2;
  top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.iconbtn {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: var(--glass); color: var(--ink-dim); border: 1px solid var(--glass-edge);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  transition: color .15s;
}
.iconbtn:hover, .iconbtn[aria-expanded="true"] { color: var(--ink); }
.iconbtn:focus-visible, .actions button:focus-visible, .swatch:focus-visible, select:focus-visible, .switch input:focus-visible {
  outline: 1.5px solid var(--accent); outline-offset: 2px;
}
.panel {
  width: min(276px, calc(100vw - 28px)); min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 14px;
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin; scrollbar-color: var(--track) transparent;
}
.brand { display: flex; flex-direction: column; gap: 3px; }
.wordmark { font: 300 17px/1 var(--font-display); letter-spacing: 0.32em; color: var(--ink); }
.sub { color: var(--ink-faint); font-size: 11px; letter-spacing: 0.02em; }

.group { display: flex; flex-direction: column; gap: 9px; }
.ghead {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
}
.gval { font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: none; color: var(--ink-dim); font-size: 11px; }

.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatch {
  height: 24px; border-radius: 7px; border: 0; padding: 0; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); transition: transform .15s;
}
.swatch:hover { transform: translateY(-1px); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--void), 0 0 0 3px var(--ink); }

.seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: 9px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--glass-edge);
}
.seg button {
  height: 26px; border: 0; border-radius: 7px; cursor: pointer; background: transparent;
  color: var(--ink-dim); font: 500 12px var(--font-ui); transition: background .15s, color .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,0.1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-edge); }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }
.seg button:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }

select {
  width: 100%; height: 30px; padding: 0 10px; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,0.04); color: var(--ink); border: 1px solid var(--glass-edge);
  font: 500 12px var(--font-ui);
}
select option { background: #0c0e17; color: var(--ink); }

.slider { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; column-gap: 8px; }
.slider label { color: var(--ink-dim); }
.slider output { font: 400 11px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--track) var(--fill, 50%));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 0; box-shadow: 0 0 0 3px rgba(3,4,9,0.55);
}
input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--ink); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent); }

.toggles { gap: 8px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; color: var(--ink-dim); }
.switch input {
  -webkit-appearance: none; appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 28px; height: 16px; border-radius: 8px; background: var(--track); position: relative; transition: background .2s;
}
.switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink-dim); transition: transform .2s, background .2s;
}
.switch input:checked { background: color-mix(in srgb, var(--accent) 42%, transparent); }
.switch input:checked::after { transform: translateX(12px); background: var(--ink); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 2px; }
.actions button {
  height: 30px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(255,255,255,0.04); color: var(--ink); border: 1px solid var(--glass-edge);
  font: 500 12px var(--font-ui);
}
.actions button:hover { background: rgba(255,255,255,0.08); }
kbd { font: 400 10px var(--font-mono); color: var(--ink-faint); }

.hud {
  position: fixed; z-index: 1; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 4px 8px; max-width: calc(100vw - 32px);
  font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-faint); letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.hud b { font-weight: 400; color: var(--ink-dim); }
.hint {
  position: fixed; z-index: 1; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  padding: 8px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  font-size: 12.5px; transition: opacity .8s ease, transform .8s ease;
}
.hint.gone { opacity: 0; transform: translate(-50%, 6px); }

.fail { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: var(--void); }
.fail div { max-width: 46ch; display: flex; flex-direction: column; gap: 10px; }
.fail h1 { margin: 0; font: 300 18px/1.3 var(--font-display); letter-spacing: 0.04em; text-wrap: balance; }
.fail p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.55; }

@media (max-width: 520px) {
  .hint { bottom: calc(48px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint, .swatch, .switch input, .switch input::after, .seg button { transition: none; }
}
</style>
</head>
<body>

<canvas id="gl" tabindex="-1" aria-label="Rökfält. Håll nere musknappen och dra för att släppa ut färgad partikelrök."></canvas>

<div class="rail">
  <button class="iconbtn" id="panelToggle" type="button" aria-expanded="true" aria-controls="panel" title="Inställningar (H)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M2 4h7M12 4h2M2 12h2M7 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="10.5" cy="4" r="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/>
      <circle cx="5.5" cy="12" r="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/>
    </svg>
  </button>
  <aside class="panel" id="panel" aria-label="Inställningar">
    <header class="brand">
      <div class="wordmark">KRAKATOA</div>
      <div class="sub">Partikelrök i realtid · WebGL2</div>
    </header>

    <section class="group">
      <div class="ghead"><span id="modeLabel">Läge</span><span class="gval"><kbd>M</kbd></span></div>
      <div class="seg" role="group" aria-labelledby="modeLabel">
        <button type="button" id="mode-particles" aria-pressed="true">Partiklar</button>
        <button type="button" id="mode-volume" aria-pressed="false">Volym</button>
      </div>
    </section>

    <section class="group">
      <div class="ghead"><span>Palett</span><span class="gval" id="paletteName">Aurora</span></div>
      <div class="swatches" id="swatches"></div>
    </section>

    <section class="group">
      <div class="ghead"><label for="quality">Kvalitet</label><span class="gval" id="qualityInfo"></span></div>
      <select id="quality"></select>
    </section>

    <section class="group" id="g-brush"><div class="ghead"><span>Pensel</span></div></section>
    <section class="group" id="g-flow"><div class="ghead"><span>Flöde</span></div></section>
    <section class="group" id="g-render"><div class="ghead"><span>Ljus och rendering</span></div></section>
    <section class="group" id="g-volume"><div class="ghead"><span>Volym</span></div></section>

    <section class="group toggles">
      <div class="ghead"><span>Lager</span></div>
      <label class="switch" for="t-showSmoke"><span>Rökfält</span><input type="checkbox" id="t-showSmoke"></label>
      <label class="switch" for="t-showParticles"><span>Partiklar</span><input type="checkbox" id="t-showParticles"></label>
      <label class="switch" for="t-cursorLight"><span>Ljuset följer pekaren</span><input type="checkbox" id="t-cursorLight"></label>
      <label class="switch" for="t-auto"><span>Autopilot</span><input type="checkbox" id="t-auto"></label>
    </section>

    <div class="actions">
      <button type="button" id="btnClear">Rensa <kbd>C</kbd></button>
      <button type="button" id="btnPause">Pausa <kbd>Space</kbd></button>
    </div>
  </aside>
</div>

<div class="hud" id="hud"><span id="hudPartBox"><b id="hudParticles">–</b> partiklar</span><span id="hudPartSep">·</span><span>grid <b id="hudGrid">–</b></span><span>·</span><span><b id="hudFps">–</b> fps</span></div>
<div class="hint" id="hint">Håll nere musknappen och dra</div>
<div class="fail" id="fail" hidden><div><h1>Rökfältet kunde inte starta</h1><p></p></div></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const canvas = $('gl');
function fail(msg) { const f = $('fail'); f.querySelector('p').textContent = msg; f.hidden = false; }

const gl = canvas.getContext('webgl2', {
  alpha: false, depth: false, stencil: false, antialias: false,
  preserveDrawingBuffer: false, powerPreference: 'high-performance',
});
if (!gl) { fail('Webbläsaren saknar WebGL2. Öppna sidan i en aktuell version av Chrome, Safari, Edge eller Firefox.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) {
  fail('Grafikkortet kan inte rendera till flyttalstexturer (EXT_color_buffer_float saknas). Vätskesimuleringen behöver det.');
  return;
}
gl.getExtension('OES_texture_float_linear');

/* ------------------------------------------------------------------ */
/* Settings                                                           */
/* ------------------------------------------------------------------ */
const coarse = matchMedia('(pointer: coarse)').matches;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);

// sim: velocity grid (short side), dye: smoke field (short side), pw×ph: particle state texture, accum: particle buffer vs CSS px
// Volume mode only: g: 3D grid cells on the short screen side, gz: grid depth vs g, jac: pressure (Jacobi) iterations,
// rm: ray-march buffer vs CSS px (at most V_RAYS rays per grid cell)
const QUALITY = {
  low:    { label: 'Låg',   sim: 96,  dye: 512,  pw: 512,  ph: 512,  accum: 0.6, g: 56,  gz: 0.67, jac: 16, rm: 0.5 },
  medium: { label: 'Medel', sim: 128, dye: 1024, pw: 1024, ph: 1024, accum: 0.8, g: 76,  gz: 0.67, jac: 20, rm: 0.6 },
  high:   { label: 'Hög',   sim: 160, dye: 1024, pw: 2048, ph: 1024, accum: 1.0, g: 112, gz: 0.67, jac: 28, rm: 0.75 },
  ultra:  { label: 'Ultra', sim: 224, dye: 1440, pw: 2048, ph: 2048, accum: 1.0, g: 128, gz: 0.67, jac: 30, rm: 0.9 },
};

// hot = colour at emission (cycles while you draw), cool = colour the smoke ages into
// Volume mode only: ember = glow of cooling smoke, smoke = albedo of cooled smoke, tail = albedo of the oldest smoke
const PALETTES = [
  { name: 'Aurora',   hot: ['#d6ff3c', '#4dffa0', '#24e4ff', '#9cff4a'], cool: '#1a3bff', key: '#2c4cff', bg: ['#010207', '#041026'], ember: '#7aff30', smoke: '#2f5cff', tail: '#2a30e0' },
  { name: 'Nebula',   hot: ['#ff2fa2', '#ff4d6d', '#c43cff', '#ff6fd6'], cool: '#1c88ff', key: '#5a2cff', bg: ['#030107', '#14062e'], ember: '#b03cff', smoke: '#3a8cff', tail: '#3a28b8' },
  { name: 'Magma',    hot: ['#fff09a', '#ffb03c', '#ff651c', '#ffd25a'], cool: '#7c0e1e', key: '#ff4a24', bg: ['#040202', '#1a0605'], ember: '#ff4810', smoke: '#8a8d94', tail: '#36373c' },
  { name: 'Spektrum', hot: ['#ff3b5c', '#ffd33b', '#3bffb2', '#3b8cff'], cool: '#4a1fb0', key: '#5b3cff', bg: ['#030308', '#0c0a22'], ember: '#ff3bd0', smoke: '#7050e0', tail: '#30188a' },
  { name: 'Aska',     hot: ['#ffffff', '#ffe8cf', '#e4eeff', '#fff4e4'], cool: '#566176', key: '#8090b4', bg: ['#030304', '#0f1117'], ember: '#ff7a2c', smoke: '#a4acbc', tail: '#464b58' },
];

const P = {
  mode: 'particles', // 'particles' = fine additive particle smoke, 'volume' = ray-marched 3D smoke solver
  coolTime: 0.5, lift: 1.0,
  quality: coarse ? 'medium' : 'high',
  palette: 0,
  brush: 0.03, emission: 1.0, force: 1.0,
  swirl: 26, turbulence: 1.0, life: 1.0,
  smoke: 0.55, particles: 1.0, light: 1.0, shadows: 1.0, bloom: 0.9,
  showSmoke: true, showParticles: true, cursorLight: true, auto: true,
  paused: false,
};
if (QUALITY[P.quality].pw > maxTex) P.quality = 'medium';

const SLIDERS = {
  'g-brush': [
    ['brush', 'Storlek', 0.012, 0.08, 0.001, (v) => (v * 100).toFixed(1) + ' %'],
    ['emission', 'Utsläpp', 0.2, 2.5, 0.05, (v) => '×' + v.toFixed(2)],
    ['force', 'Kraft', 0.2, 2.5, 0.05, (v) => '×' + v.toFixed(2)],
  ],
  'g-flow': [
    ['swirl', 'Virvlar', 0, 60, 1, (v) => v.toFixed(0)],
    ['turbulence', 'Turbulens', 0, 3, 0.05, (v) => v.toFixed(2)],
    // particles: mean particle life; Volym: how long smoke stays visible after it leaves the emitter (volLife)
    ['life', 'Livslängd', 0.3, 3, 0.05, (v) => (P.mode === 'volume' ? volLife(v) : 3.3 * v).toFixed(1) + ' s'],
  ],
  'g-render': [
    ['smoke', 'Rökfält', 0, 1.5, 0.05, (v) => v.toFixed(2)],
    ['particles', 'Partikeltäthet', 0, 3, 0.05, (v) => v.toFixed(2)],
    ['light', 'Ljus', 0, 3, 0.05, (v) => v.toFixed(2)],
    ['shadows', 'Skuggor', 0, 3, 0.05, (v) => v.toFixed(2)],
    ['bloom', 'Glöd', 0, 2, 0.05, (v) => v.toFixed(2)],
  ],
  'g-volume': [
    ['coolTime', 'Avsvalning', 0.15, 2, 0.05, (v) => v.toFixed(2).replace('.', ',') + ' s'],
    ['lift', 'Lyftkraft', 0, 3, 0.05, (v) => '×' + v.toFixed(2)],
  ],
};
const sliderSync = {}; // key → refresh its output (setMode: Livslängd reads differently per mode)

/* ------------------------------------------------------------------ */
/* Shaders                                                            */
/* ------------------------------------------------------------------ */
const VS_QUAD = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPos;
uniform vec2 uTexel;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
void main() {
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(uTexel.x, 0.0); vR = vUv + vec2(uTexel.x, 0.0);
  vT = vUv + vec2(0.0, uTexel.y); vB = vUv - vec2(0.0, uTexel.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FH = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
out vec4 o;
`;

// PCG hash, interleaved gradient noise, and 2D gradient noise with analytic derivatives (for curl noise)
const COMMON = `
uint pcg(uint v) { uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(inout uint s) { s = pcg(s); return float(s) * 2.3283064e-10; }
float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
vec2 grad2(ivec2 i) {
  uint h = pcg(uint(i.x) * 1597334677u ^ pcg(uint(i.y) + 0x9E3779B9u));
  float a = float(h) * 1.4629181e-9;
  return vec2(cos(a), sin(a));
}
vec3 noised(vec2 p) {
  vec2 i = floor(p); vec2 f = p - i; ivec2 ii = ivec2(i);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec2 ga = grad2(ii), gb = grad2(ii + ivec2(1, 0)), gc = grad2(ii + ivec2(0, 1)), gd = grad2(ii + ivec2(1, 1));
  float va = dot(ga, f), vb = dot(gb, f - vec2(1.0, 0.0)), vc = dot(gc, f - vec2(0.0, 1.0)), vd = dot(gd, f - vec2(1.0, 1.0));
  return vec3(va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * (va - vb - vc + vd),
              ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd) +
              du * (u.yx * (va - vb - vc + vd) + vec2(vb, vc) - va));
}
`;

const FS = {
  copy: `uniform sampler2D uSrc; uniform float uMul;
void main() { o = texture(uSrc, vUv) * uMul; }`,

  // Stroke splat: Gaussian around up to 16 line segments (capsules), so fast strokes leave no gaps.
  splat: `uniform sampler2D uSrc;
uniform int uN; uniform vec2 uA[16]; uniform vec2 uB[16]; uniform vec4 uV[16];
uniform float uAspect, uRad2, uMaxA;
void main() {
  vec2 p = vec2(vUv.x * uAspect, vUv.y);
  float best = 0.0; vec4 val = vec4(0.0);
  for (int i = 0; i < 16; i++) {
    if (i >= uN) break;
    vec2 a = vec2(uA[i].x * uAspect, uA[i].y), b = vec2(uB[i].x * uAspect, uB[i].y);
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-9), 0.0, 1.0);
    vec2 d = pa - ba * h;
    float g = exp(-dot(d, d) / uRad2);
    if (g > best) { best = g; val = uV[i]; }
  }
  vec4 c = texture(uSrc, vUv) + best * val;
  if (uMaxA > 0.0 && c.a > uMaxA) c *= uMaxA / c.a;
  o = c;
}`,

  advect: `uniform sampler2D uVel, uSrc; uniform vec2 uVelTexel; uniform float uDt, uDiss;
void main() {
  vec2 coord = vUv - uDt * texture(uVel, vUv).xy * uVelTexel;
  o = texture(uSrc, coord) / (1.0 + uDiss * uDt);
}`,

uniform vec2 uLight; uniform float uLightZ, uFalloff, uAbsorb, uAspect, uNormal, uSelf, uFrameF;

float D(vec2 p) { return texture(uDens, p).a; }

const VS_POINTS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uState;
uniform int uW;
uniform float uLifeMin, uLifeMax, uPointSize, uWeight, uCooling;
uniform vec3 uHot[4]; uniform vec3 uCool;
out vec4 vCol;
${COMMON}
vec3 pal(float t) {
  t = fract(t) * 4.0; int i = int(t);
  return mix(uHot[i], uHot[(i + 1) & 3], smoothstep(0.0, 1.0, fract(t)));
}
void main() {
  int id = gl_VertexID;
  vec4 s = texelFetch(uState, ivec2(id % uW, id / uW), 0);
  uint h = pcg(uint(id) + 0x6A09E667u);
  float r1 = float(h & 0xFFFFu) * (1.0 / 65535.0);
  float r2 = float(h >> 16u) * (1.0 / 65535.0);
  float k = s.z / mix(uLifeMin, uLifeMax, r1);
  if (k >= 1.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 1.0; vCol = vec4(0.0); return; }
  float a = smoothstep(0.0, 0.04, s.z) * (1.0 - smoothstep(0.35, 1.0, k));
  vec3 col = mix(pal(s.w), uCool, 1.0 - exp(-uCooling * s.z));
  float w = a * mix(0.5, 1.6, r2 * r2) * uWeight;
  vCol = vec4(col * w, w);
  gl_Position = vec4(s.xy * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = uPointSize;
}`;

/* ------------------------------------------------------------------ */
/* Volume mode shaders: 3D smoke solver + volumetric ray march         */
/* ------------------------------------------------------------------ */
// Kept apart from FS so a compile failure here only disables volume mode instead of the whole page.
// Every 3D field lives in a "flat 3D texture": a 2D atlas whose tiles are the Z slices (uCols tiles per row),
// so each solver pass is one fullscreen draw over the atlas. Neighbours are texelFetch'ed; semi-Lagrangian
// lookups take two hardware-bilinear taps in adjacent slices, clamped half a texel inside the tile so tiles
// never bleed into each other. Solver units: grid cells and seconds.
// Trilinear lookup at p (cell units, centres at +0.5) in an atlas of grid G with cols tiles per row; also used by
// the ray march for the light atlas
const V_SX = `
vec4 Sx(sampler2D s, vec3 p, ivec3 G, int cols, vec2 atl) {
  p = clamp(p, vec3(0.5), vec3(G) - 0.5);
  float zf = p.z - 0.5, z0 = floor(zf);
  int k0 = int(z0), k1 = min(k0 + 1, G.z - 1);
  vec2 a = vec2(ivec2(k0 % cols, k0 / cols) * G.xy) + p.xy;
  vec2 b = vec2(ivec2(k1 % cols, k1 / cols) * G.xy) + p.xy;
  return mix(texture(s, a * atl), texture(s, b * atl), zf - z0);
}
`;
const V_ATLAS = `
uniform ivec3 uG;
uniform int uCols;
uniform vec2 uAtl;
ivec2 texOf(ivec3 c) { return ivec2(c.z % uCols, c.z / uCols) * uG.xy + c.xy; }
// fragment → cell; false on the unused tiles at the end of the atlas
bool cell(out ivec3 c) {
  ivec2 f = ivec2(gl_FragCoord.xy), t = f / uG.xy;
  c = ivec3(f - t * uG.xy, t.y * uCols + t.x);
  return c.z < uG.z;
}
// neighbour fetch clamped to the grid (zero gradient: open boundary)
vec4 F(sampler2D s, ivec3 c) { return texelFetch(s, texOf(clamp(c, ivec3(0), uG - 1)), 0); }
// Pressure and divergence are packed 4 cells along x per RGBA texel (grid uGp = X/4, Y, Z, same tile order),
// so a Jacobi iteration updates 4 cells with 7 fetches. p = 0 outside the grid (open boundary).
uniform ivec3 uGp;
ivec2 ptexOf(ivec3 c) { return ivec2(c.z % uCols, c.z / uCols) * uGp.xy + c.xy; }
bool pcell(out ivec3 c) {
  ivec2 f = ivec2(gl_FragCoord.xy), t = f / uGp.xy;
  c = ivec3(f - t * uGp.xy, t.y * uCols + t.x);
  return c.z < uGp.z;
}
vec4 PP(sampler2D s, ivec3 c) {
  return (any(lessThan(c, ivec3(0))) || any(greaterThanEqual(c, uGp))) ? vec4(0.0) : texelFetch(s, ptexOf(c), 0);
}
float P0(sampler2D s, ivec3 c) {
  return (any(lessThan(c, ivec3(0))) || any(greaterThanEqual(c, uG))) ? 0.0 : texelFetch(s, ptexOf(ivec3(c.x >> 2, c.yz)), 0)[c.x & 3];
}
${V_SX}
vec4 S(sampler2D s, vec3 p) { return Sx(s, p, uG, uCols, uAtl); }
// Open faces for the scalars: a backtrace that leaves the grid brings in clean air. Weight of the source sample at
// p: 1 up to the outer cell centres, fading to 0 half a cell outside the face (a zero ghost cell).
float inflow(vec3 p) { vec3 e = min(p, vec3(uG) - p); return clamp(min(min(e.x, e.y), e.z) + 0.5, 0.0, 1.0); }
`;

// Soft spherical emitters swept along this frame's stroke segments (capsules on the mid plane)
const V_BRUSH = `
uniform int uN;
uniform vec3 uEA[16];
uniform vec3 uEB[16];
uniform float uRad2;
float brush(vec3 p, out vec3 rel, out int bi) {
  float best = 0.0; rel = vec3(0.0, 1.0, 0.0); bi = 0;
  for (int i = 0; i < 16; i++) {
    if (i >= uN) break;
    vec3 a = uEA[i], ba = uEB[i] - a, pa = p - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
    vec3 d = pa - ba * h;
    float g = exp(-dot(d, d) / uRad2);
    if (g > best) { best = g; rel = d; bi = i; }
  }
  return best;
}
`;

// Value noise for the emitters (only evaluated inside a brush)
const V_NOISE = `
float hash3(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = p - i;
  f = f * f * (3.0 - 2.0 * f);
  vec2 e = vec2(1.0, 0.0);
  return mix(mix(mix(hash3(i), hash3(i + e.xyy), f.x), mix(hash3(i + e.yxy), hash3(i + e.xxy), f.x), f.y),
             mix(mix(hash3(i + e.yyx), hash3(i + e.xyx), f.x), mix(hash3(i + e.yxx), hash3(i + e.xxx), f.x), f.y), f.z);
}
`;

const VFS = {
  // Scalars (x: density, y: temperature, z: freshness), MacCormack step 1: semi-Lagrangian advection (RK2
  // backtrace) by last step's divergence-free velocity
  advS: V_ATLAS + `uniform sampler2D uVel, uSrc; uniform float uDt;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 p = vec3(c) + 0.5;
  vec3 v = S(uVel, p - 0.5 * uDt * F(uVel, c).xyz).xyz;
  vec3 b = p - uDt * v;
  o = S(uSrc, b) * inflow(b);
}`,

  // MacCormack step 2: trace the result forward again and correct by half the round-trip error. Where the
  // corrected value overshoots the source cell's neighbourhood it falls back to the semi-Lagrangian value (a clamp
  // to the maximum would keep the overshoot); where it undershoots it is clamped to the neighbourhood minimum (a
  // fallback would lift it back up at every plume edge). Each picks the lower of the two options, but the clamp
  // still lifts undershoots, so with no emitter active (uN = 0) the density is scaled by the mass cap's factor
  // (massCap), which keeps its total from growing. Then decay, and the emitters: noisy density is added,
  // temperature and freshness are set to the brush profile.
  advS2: V_ATLAS + V_BRUSH + V_NOISE + `uniform sampler2D uVel, uSrc, uHat, uMass; uniform float uDt, uDRate, uDMax, uTRate, uTime; uniform vec3 uDecay;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 p = vec3(c) + 0.5;
  vec3 v = S(uVel, p - 0.5 * uDt * F(uVel, c).xyz).xyz;
  vec3 b = p - uDt * v;
  ivec3 i0 = ivec3(floor(clamp(b, vec3(0.5), vec3(uG) - 0.5) - 0.5));
  vec4 lo = F(uSrc, i0), hi = lo;
  for (int k = 1; k < 8; k++) {
    vec4 q = F(uSrc, i0 + ivec3(k & 1, (k >> 1) & 1, k >> 2));
    lo = min(lo, q); hi = max(hi, q);
  }
  // inflow through an open face scales the neighbourhood like it scaled hat
  float wi = inflow(b);
  lo *= wi; hi *= wi;
  vec4 hat = texelFetch(uHat, texOf(c), 0);
  vec4 s = hat + 0.5 * (texelFetch(uSrc, texOf(c), 0) - S(uHat, p + uDt * v));
  s = mix(max(s, lo), hat, step(hi + 1e-6, s));
  if (uN == 0) s.x *= texelFetch(uMass, ivec2(0), 0).y;
  s.xyz *= uDecay;
  vec3 rel; int bi;
  float w = brush(p, rel, bi);
  if (w > 1e-3) {
    // heat builds up while the gas passes the emitter, so the hot core is shaped by the flow (a flame, not a ball)
    float n = vnoise(p * 0.22 + vec3(0.0, -uTime * 2.5, uTime * 0.8));
    s.x = min(s.x + uDRate * uDt * w * (0.25 + 1.5 * n * n), uDMax);
    s.y = min(s.y + uTRate * uDt * w * (0.4 + 1.2 * n), 1.2);
    s.z = max(s.z, w);
  }
  o = s;
}`,

  // Mass cap, 1: each texel sums a 4×4 block of uSrc (texels past its edge count 0), so a few passes take the
  // scalar atlas down to its totals in one RGBA32F texel
  sum: `uniform sampler2D uSrc;
void main() {
  ivec2 b = ivec2(gl_FragCoord.xy) * 4, n = textureSize(uSrc, 0);
  vec4 s = vec4(0.0);
  for (int j = 0; j < 4; j++) for (int i = 0; i < 4; i++) {
    ivec2 t = b + ivec2(i, j);
    if (t.x < n.x && t.y < n.y) s += texelFetch(uSrc, t, 0);
  }
  o = s;
}`,

  // Mass cap, 2: x = this step's density total (uSum), y = the factor advS2 scales the limited density by. Last
  // step's limited total is this total over last step's factor and decay (uDk), so y = min(1, last step's total /
  // its limited total) and the total cannot grow. y = 1 when uOn = 0 (last step injected, or the grid is new) and
  // when there is no density.
  mass: `uniform sampler2D uSum, uPrev; uniform float uOn, uDk;
void main() {
  float m = texelFetch(uSum, ivec2(0), 0).x;
  vec4 p = texelFetch(uPrev, ivec2(0), 0);
  o = vec4(m, uOn > 0.0 && m > 0.0 && p.x > 0.0 ? min(1.0, p.x * p.y * uDk / m) : 1.0, 0.0, 0.0);
}`,

  advV: V_ATLAS + `uniform sampler2D uVel; uniform float uDt, uDamp;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 p = vec3(c) + 0.5;
  o = vec4(S(uVel, p - uDt * F(uVel, c).xyz).xyz * uDamp, 0.0);
}`,

  // xyz: vorticity (curl of velocity), w: its magnitude
  curl: V_ATLAS + `uniform sampler2D uVel;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 L = F(uVel, c - ivec3(1, 0, 0)).xyz, R = F(uVel, c + ivec3(1, 0, 0)).xyz;
  vec3 B = F(uVel, c - ivec3(0, 1, 0)).xyz, T = F(uVel, c + ivec3(0, 1, 0)).xyz;
  vec3 K = F(uVel, c - ivec3(0, 0, 1)).xyz, N = F(uVel, c + ivec3(0, 0, 1)).xyz;
  vec3 w = 0.5 * vec3(T.z - B.z - N.y + K.y, N.x - K.x - R.z + L.z, R.y - L.y - T.x + B.x);
  o = vec4(w, length(w));
}`,

  // Vorticity confinement, buoyancy (hot gas rises; fresh smoke keeps a little lift), ABC-flow turbulence where
  // there is smoke, and the emitters: a pull toward the pointer velocity plus a gentle outward push.
  force: V_ATLAS + V_BRUSH + `uniform sampler2D uVel, uCurl, uScal;
uniform float uDt, uEps, uBuoy, uTurb, uTF, uTime, uKin, uPush;
uniform vec3 uEV[16];
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 v = F(uVel, c).xyz;
  vec3 w = F(uCurl, c).xyz;
  vec3 g = vec3(F(uCurl, c + ivec3(1, 0, 0)).w - F(uCurl, c - ivec3(1, 0, 0)).w,
                F(uCurl, c + ivec3(0, 1, 0)).w - F(uCurl, c - ivec3(0, 1, 0)).w,
                F(uCurl, c + ivec3(0, 0, 1)).w - F(uCurl, c - ivec3(0, 0, 1)).w);
  vec4 s = F(uScal, c);
  // confinement only where there is smoke, so empty air cannot feed back on itself
  vec3 f = uEps * min(s.x * 4.0, 1.0) * cross(g / (length(g) + 1e-4), w);

  f.y += uBuoy * (s.y + 0.45 * s.z);
  vec3 p = vec3(c) + 0.5;
  vec3 q = p * uTF, t = uTime * vec3(0.53, 0.71, 0.37);
  vec3 r = mat3(0.36, 0.48, -0.8, -0.8, 0.6, 0.0, 0.48, 0.64, 0.6) * q * 2.3 + 4.1;
  vec3 abc = vec3(sin(q.z + t.x) + cos(q.y + t.y), sin(q.x + t.y) + cos(q.z + t.z), sin(q.y + t.z) + cos(q.x + t.x))
           + 0.5 * vec3(sin(r.z - t.y) + cos(r.y + t.z), sin(r.x - t.z) + cos(r.z + t.x), sin(r.y - t.x) + cos(r.x + t.y));
  f += uTurb * abc * min(s.x, 1.0);
  v += uDt * f;
  vec3 rel; int bi;
  float b = brush(p, rel, bi);
  if (b > 1e-3) {
    vec3 ve = uEV[bi];
    float sp = length(ve);
    if (sp > 1e-3) { vec3 dir = ve / sp; v += dir * (max(sp - dot(v, dir), 0.0) * min(b * uKin, 1.0)); }
    v += rel / (length(rel) + 0.5) * (uPush * b * uDt);
  }
  o = vec4(v, 0.0);
}`,

  // Divergence of 4 consecutive cells (packed layout)
  div: V_ATLAS + `uniform sampler2D uVel;
void main() {
  ivec3 c; if (!pcell(c)) { o = vec4(0.0); return; }
  ivec3 b = ivec3(c.x * 4, c.yz);
  float u[6];
  for (int i = 0; i < 6; i++) u[i] = F(uVel, b + ivec3(i - 1, 0, 0)).x;
  vec4 d;
  for (int i = 0; i < 4; i++) {
    ivec3 q = b + ivec3(i, 0, 0);
    d[i] = 0.5 * (u[i + 2] - u[i] + F(uVel, q + ivec3(0, 1, 0)).y - F(uVel, q - ivec3(0, 1, 0)).y
                                  + F(uVel, q + ivec3(0, 0, 1)).z - F(uVel, q - ivec3(0, 0, 1)).z);
  }
  o = d;
}`,

  // One Jacobi iteration of lap(p) = div for 4 cells; uMul < 1 on the first iteration damps the warm start
  jacobi: V_ATLAS + `uniform sampler2D uP, uDiv; uniform float uMul;
void main() {
  ivec3 c; if (!pcell(c)) { o = vec4(0.0); return; }
  vec4 C = PP(uP, c);
  vec4 s = vec4(PP(uP, c - ivec3(1, 0, 0)).w, C.xyz) + vec4(C.yzw, PP(uP, c + ivec3(1, 0, 0)).x)
         + PP(uP, c - ivec3(0, 1, 0)) + PP(uP, c + ivec3(0, 1, 0)) + PP(uP, c - ivec3(0, 0, 1)) + PP(uP, c + ivec3(0, 0, 1));
  o = (s * uMul - texelFetch(uDiv, ptexOf(c), 0)) / 6.0;
}`,

  grad: V_ATLAS + `uniform sampler2D uP, uVel;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 g = 0.5 * vec3(P0(uP, c + ivec3(1, 0, 0)) - P0(uP, c - ivec3(1, 0, 0)),
                      P0(uP, c + ivec3(0, 1, 0)) - P0(uP, c - ivec3(0, 1, 0)),
                      P0(uP, c + ivec3(0, 0, 1)) - P0(uP, c - ivec3(0, 0, 1)));
  o = vec4(F(uVel, c).xyz - g, 0.0);
}`,

  // Resize / quality change: resample an old atlas (grid uGo, uColso tiles per row) into the current grid. With
  // uK = 0 each axis is stretched by its own grid ratio; with uK > 0 a new cell spans uK old cells about the
  // centre (the scene keeps its size on screen) and what falls outside the old box is empty. Velocity (uVmax > 0)
  // is capped at uVmax cells/s, so a very uneven per-axis stretch cannot blow it up.
  resample: V_ATLAS + `uniform sampler2D uSrc; uniform ivec3 uGo; uniform int uColso; uniform vec2 uAtlo; uniform vec4 uMul; uniform float uVmax, uK;
void main() {
  ivec3 c; if (!cell(c)) { o = vec4(0.0); return; }
  vec3 p = uK > 0.0 ? (vec3(c) + 0.5 - 0.5 * vec3(uG)) * uK + 0.5 * vec3(uGo) : (vec3(c) + 0.5) / vec3(uG) * vec3(uGo);
  if (any(lessThan(p, vec3(0.0))) || any(greaterThan(p, vec3(uGo)))) { o = vec4(0.0); return; }
  o = Sx(uSrc, p, uGo, uColso, uAtlo) * uMul;
  if (uVmax > 0.0) o.xyz *= min(1.0, uVmax / max(length(o.xyz), 1e-6));
}`,

  // Light volume at half resolution, one draw over its own atlas (uLg cells per tile, uLc tiles per row; a few
  // small layered draws would cost far more than the work in them): rgb = emitter point light × falloff ×
  // transmittance (marched toward the emitter, stopping at its radius) + key light from above × transmittance;
  // a = key-light transmittance.
  light: `precision highp sampler3D;
uniform sampler3D uDen;
uniform ivec3 uLg; uniform int uLc;
uniform vec3 uBox, uLp, uLcol, uKcol, uKd;
uniform float uLRad, uFall, uExtL;
void main() {
  ivec2 f = ivec2(gl_FragCoord.xy), t = f / uLg.xy;
  int k = t.y * uLc + t.x;
  if (k >= uLg.z) { o = vec4(0.0); return; }
  vec3 inv = 0.5 / uBox;
  vec3 p = ((vec3(f - t * uLg.xy, k) + 0.5) / vec3(uLg) - 0.5) * 2.0 * uBox;
  vec3 tl = uLp - p;
  float dist = length(tl);
  vec3 dir = tl / max(dist, 1e-4);
  // steps grow quadratically away from the cell: fine near (soft self-shadow detail), coarse far away
  const int N = 14;
  float span = max(dist - uLRad, 0.0), tau = 0.0;
  for (int i = 0; i < N; i++) {
    float a = float(i) / float(N), b = float(i + 1) / float(N);
    tau += texture(uDen, (p + dir * (span * 0.5 * (a * a + b * b))) * inv + 0.5).x * (b * b - a * a);
  }
  float Tp = exp(-tau * span * uExtL);
  vec3 te = (sign(uKd) * uBox - p) / uKd;
  float sk = min(min(te.x, te.y), te.z), tk = 0.0;
  for (int i = 0; i < N; i++) {
    float a = float(i) / float(N), b = float(i + 1) / float(N);
    tk += texture(uDen, (p + uKd * (sk * 0.5 * (a * a + b * b))) * inv + 0.5).x * (b * b - a * a);
  }
  float Tk = exp(-tk * sk * uExtL);
  o = vec4(uLcol * (Tp / (1.0 + dist * dist * uFall)) + uKcol * Tk, Tk);
}`,

  // Ray march through the box: fixed camera on +z with mild perspective, the mid plane z = 0 exactly fills the
  // screen. Beer–Lambert absorption, single scattering of the light volume (+ ambient for multiple scattering),
  // emission from temperature, jittered start. rgb: premultiplied radiance, a: opacity.
  march: COMMON + V_SX + `precision highp sampler3D;
uniform sampler3D uDen;
uniform sampler2D uLit; uniform ivec3 uLg; uniform int uLc; uniform vec2 uLAtl;
uniform vec3 uBox, uHot, uEmb, uAlb, uTail, uAmb, uKcol;
uniform float uCam, uAspect, uExt, uStep, uFrameF, uEmis;
// below this density a step's opacity is about 1e-5 or less (see d below): skip the light fetch and shading
const float SHADE_MIN = 0.01;
#ifdef DETAIL
// Sub-grid detail (pv.marchD, see VT): the two noise-coordinate atlases share the light atlas layout
uniform sampler2D uCrdA, uCrdB;
uniform sampler3D uNz;
uniform vec3 uGc, uNo0, uNo1;
uniform vec2 uPh;
uniform float uDetA, uDetF, uDetF2, uOct2, uMod, uErode, uDLo, uDHi;
#endif
void main() {
  vec3 ro = vec3(0.0, 0.0, uCam);
  vec3 rd = normalize(vec3((vUv.x - 0.5) * uAspect, vUv.y - 0.5, -uCam));
  rd += 1e-6 * step(abs(rd), vec3(1e-7));
  vec3 ta = (-uBox - ro) / rd, tb = (uBox - ro) / rd;
  vec3 t0 = min(ta, tb), t1 = max(ta, tb);
  float tn = max(max(t0.x, t0.y), t0.z), tf = min(min(t1.x, t1.y), t1.z);
  vec3 col = vec3(0.0);
  float T = 1.0;
  if (tf > tn) {
    vec3 inv = 0.5 / uBox;
    float t = tn + uStep * ign(gl_FragCoord.xy + uFrameF * 5.588238);
    for (int i = 0; i < 400; i++) {
      if (t >= tf) break;
      vec3 u = (ro + rd * t) * inv + 0.5;
      vec4 s = texture(uDen, u);
#ifdef DETAIL
      // Sub-grid detail near smoke (empty space costs what it did). A, B: noise coordinates of the two phases;
      // A.w: local average density, so only big billows get detail (thin tendrils keep the grid look);
      // B.w: how much to hold it back (hot flame gas, fast jets, over-stretched noise).
      if (s.x > 1e-4) {
        vec3 pl = u * vec3(uLg);
        vec4 A = Sx(uCrdA, pl, uLg, uLc, uLAtl);
        float g = smoothstep(uDLo, uDHi, A.w);
        if (g > 0.01) {
          vec4 B = Sx(uCrdB, pl, uLg, uLc, uLAtl);
          g *= 1.0 - B.w;
          if (g > 0.01) {
            // noise on advected coordinates (it moves, stretches and curls with the smoke): two phases half a
            // period apart, each restarted where its weight is zero (uPh = weights); rgb displaces the density
            // lookup (curl noise: divergence-free), a modulates it
            vec3 pc = u * uGc;
            vec3 qa = (pc + A.xyz) * uDetF + uNo0, qb = (pc + B.xyz) * uDetF + uNo1;
            vec4 n = texture(uNz, qa) * uPh.x + texture(uNz, qb) * uPh.y - 0.5 * (uPh.x + uPh.y);
            if (uOct2 > 0.0) n += uOct2 * (texture(uNz, qa * uDetF2 + 0.37) * uPh.x + texture(uNz, qb * uDetF2 + 0.71) * uPh.y - 0.5 * (uPh.x + uPh.y));
            u += 2.0 * n.xyz * (uDetA * g) / uGc;
            s = texture(uDen, u);
            s.x = max(s.x * (1.0 + uMod * g * 2.0 * n.w) - uErode * g * clamp(0.5 + n.w, 0.0, 1.0), 0.0);
          }
        }
      }
#endif
      if (s.x > SHADE_MIN) {
        vec3 e = min(u, 1.0 - u) * uBox;
        float hot = smoothstep(0.1, 0.9, s.y);
        // hot gas is thin and glowing; thin haze fades out faster than dense smoke (crisper wisps); fade at the box faces
        float d = s.x * (1.0 - 0.55 * hot) * smoothstep(0.0, 0.3, s.x) * smoothstep(0.0, 0.04, min(min(e.x, e.y), e.z));
        float a = 1.0 - exp(-d * uExt * uStep);
        vec4 L = Sx(uLit, u * vec3(uLg), uLg, uLc, uLAtl);
        vec3 alb = mix(uTail, uAlb, s.z) * (1.0 - 0.75 * hot);
        // key light (single scattering) reads a little paler than the deep, saturated ambient/glow-lit smoke
        vec3 key = uKcol * L.a;
        vec3 albK = mix(alb, vec3(max(alb.r, max(alb.g, alb.b))), 0.12);
        vec3 em = mix(uEmb, uHot, smoothstep(0.7, 1.15, s.y)) * (uEmis * hot * hot);
        col += T * a * (albK * key + alb * (L.rgb - key + uAmb * (0.35 + 0.65 * L.a)) + em);
        T *= 1.0 - a;
        if (T < 0.01) break;
      }
      t += uStep;
    }
  }
  o = vec4(col, 1.0 - T);
}`,

  // Background + upsampled ray-march layer into the HDR scene (then the shared bloom + tonemap)
  comp: `uniform sampler2D uMarch; uniform vec2 uMTexel; uniform float uAspect, uAir; uniform vec3 uBg0, uBg1, uLightCol; uniform vec2 uLightPos;
void main() {
  vec2 q = (vUv - vec2(0.5, 0.42)) * vec2(uAspect, 1.0);
  vec3 bg = mix(uBg1, uBg0, smoothstep(0.0, 1.0, length(q)));
  vec2 dl = (vUv - uLightPos) * vec2(uAspect, 1.0);
  bg += uLightCol * uAir / (1.0 + dot(dl, dl) * 30.0);
  // 4 bilinear taps = a soft 3×3 tent in march texels: upsamples and hides the jittered-start noise
  vec2 t = uMTexel * 0.75;
  vec4 m = 0.25 * (texture(uMarch, vUv + vec2(-t.x, -t.y)) + texture(uMarch, vUv + vec2(t.x, -t.y))
                 + texture(uMarch, vUv + vec2(-t.x, t.y)) + texture(uMarch, vUv + vec2(t.x, t.y)));
  o = vec4(m.rgb + bg * (1.0 - m.a), 1.0);
}`,
};

// Sub-grid detail (VT), compiled apart from VFS so a failure here only turns the detail off: noise coordinates,
// one atlas per noise phase on the half-res grid, laid out like the light atlas (plain 2D draws, which are far
// cheaper here than layered draws into a 3D texture). xyz = offset from the cell to where its smoke was when the
// phase started (cells), advected with the flow (semi-Lagrangian) and zeroed when the phase restarts. w: phase A =
// density averaged over the 4×4×4 cells around the voxel (gates the detail to big billows); phase B = how much to
// hold the detail back (hot flame gas, fast jets, noise over-stretched in either phase, i.e. squeezed finer than
// the ray march can sample; a phase's stretch fades out with its blend weight before it restarts, so the phase
// that is about to restart never gates the other one).
const V_CRD = V_ATLAS + `precision highp sampler3D;
uniform sampler2D uVel, uCrd, uCrdO; uniform sampler3D uDen;
uniform ivec3 uLg; uniform int uLc; uniform vec2 uLAtl, uFast, uStr, uPhW; uniform float uDt, uReset; uniform int uCh;
vec3 FL(sampler2D s, ivec3 c) { c = clamp(c, ivec3(0), uLg - 1); return texelFetch(s, ivec2(c.z % uLc, c.z / uLc) * uLg.xy + c.xy, 0).xyz; }
// Frobenius norm of the Jacobian of the noise coordinates p + phi(p): sqrt 3 when unstretched
float stretch(sampler2D s, ivec3 c) {
  mat3 J = mat3(1.0) + mat3(FL(s, c + ivec3(1, 0, 0)) - FL(s, c - ivec3(1, 0, 0)),
                            FL(s, c + ivec3(0, 1, 0)) - FL(s, c - ivec3(0, 1, 0)),
                            FL(s, c + ivec3(0, 0, 1)) - FL(s, c - ivec3(0, 0, 1))) * 0.25;
  return sqrt(dot(J[0], J[0]) + dot(J[1], J[1]) + dot(J[2], J[2]));
}
void main() {
  ivec2 f = ivec2(gl_FragCoord.xy), t = f / uLg.xy;
  ivec3 h = ivec3(f - t * uLg.xy, t.y * uLc + t.x);
  if (h.z >= uLg.z) { o = vec4(0.0); return; }
  vec3 k = vec3(uG) / vec3(uLg), c = (vec3(h) + 0.5) * k;
  vec3 v = S(uVel, c).xyz, d = v * uDt;
  vec3 phi = uReset > 0.5 ? vec3(0.0) : Sx(uCrd, (c - d) / k, uLg, uLc, uLAtl).xyz - d;
  vec3 inv = 1.0 / vec3(uG);
  vec2 a = vec2(0.0);
  for (int j = 0; j < 8; j++) a += texture(uDen, (c + vec3(j & 1, (j >> 1) & 1, j >> 2) * 2.0 - 1.0) * inv).xy;
  a *= 0.125;
  if (uCh == 0) { o = vec4(phi, a.x); return; }
  // stretch of the new A and of B, each in full while its phase weight (uPhW) is 0.5 or more, then fading with it
  // to 0 at its restart (a plain weighted mean would let half-weight stretched noise through as streaks)
  float sa = smoothstep(uStr.x, uStr.y, stretch(uCrdO, h)) * min(1.0, 2.0 * uPhW.x);
  float sb = uReset > 0.5 ? 0.0 : smoothstep(uStr.x, uStr.y, stretch(uCrd, h)) * min(1.0, 2.0 * uPhW.y);
  o = vec4(phi, max(max(smoothstep(0.04, 0.3, a.y), smoothstep(uFast.x, uFast.y, length(v))), max(sa, sb)));
}`;

// The density copy into a TEXTURE_3D writes MRT layers (no gl_Layer in WebGL2): each draw attaches n consecutive
// layers starting at uL0, and at(k) computes layer k at this fragment.
function fsLayers(body, n) {
  let outs = '', calls = '';
  for (let j = 0; j < n; j++) { outs += `layout(location = ${j}) out vec4 o${j};\n`; calls += `  o${j} = at(uL0 + ${j});\n`; }
  return `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
${outs}uniform int uL0;
${body}
void main() {
${calls}}`;
}
// Scalar atlas → TEXTURE_3D (hardware trilinear for the light pass and the ray march)
const V_TO3D = `uniform sampler2D uSrc; uniform ivec3 uG; uniform int uCols;
vec4 at(int k) { k = min(k, uG.z - 1); return texelFetch(uSrc, ivec2(k % uCols, k / uCols) * uG.xy + ivec2(gl_FragCoord.xy), 0); }`;

/* ------------------------------------------------------------------ */
/* GL plumbing                                                        */
/* ------------------------------------------------------------------ */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  const vs = compile(gl.VERTEX_SHADER, vsSrc), fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = (gl.getShaderInfoLog(vs) || '') + (gl.getShaderInfoLog(fs) || '') + (gl.getProgramInfoLog(p) || '');
    throw new Error(log);
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

let pr;
try {
  pr = {};
  for (const k of Object.keys(FS)) if (k !== 'pFrag') pr[k] = program(VS_QUAD, FH + FS[k]);
  pr.points = program(VS_POINTS, FS.pFrag);
} catch (err) {
  console.error(err);
  fail('En shader gick inte att kompilera på den här grafikdrivern. Detaljer finns i webbläsarens konsol.');
  return;
}
// Volume mode programs: if any of them fails, only the volume mode is disabled
let volOK = true;
const pv = {};
try {
  for (const k of Object.keys(VFS)) pv[k] = program(VS_QUAD, FH + VFS[k]);
} catch (err) {
  console.error('Volymläget är avstängt:', err);
  volOK = false;
  P.mode = 'particles';
}
// Sub-grid detail programs: if either fails, Volym keeps the plain march
let vDet = volOK;
if (volOK) {
  try {
    pv.crd = program(VS_QUAD, FH + V_CRD);
    pv.marchD = program(VS_QUAD, FH + '#define DETAIL\n' + VFS.march);
  } catch (err) {
    console.warn('Volymens detaljbrus är avstängt:', err);
    vDet = false;
  }
}

let cur = null;
const use = (prog) => { cur = prog; gl.useProgram(prog.p); };
function uf(n, a, b, c, d) {
  const l = cur.u[n]; if (l == null) return;
  if (b === undefined) gl.uniform1f(l, a);
  else if (c === undefined) gl.uniform2f(l, a, b);
  else if (d === undefined) gl.uniform3f(l, a, b, c);

  uf('uDt', dt); uf('uEps', P.swirl * 0.002 * Y); uf('uBuoy', 0.9 * P.lift * Y);
  uf('uTurb', P.turbulence * 0.3 * Y); uf('uTF', 6.2831853 / (0.42 * Y)); uf('uTime', time);
  uf('uKin', 0.6); uf('uPush', 0.5 * P.force * Y); uarr('uEV', 'uniform3fv', emV);
  draw(V.vel.write); V.vel.swap();

  // 4. Pressure projection (Jacobi, warm-started from last frame)
  use(pv.div); atlasU(); ut('uVel', 0, V.vel.read); draw(V.div);
  use(pv.jacobi); atlasU();
  for (let i = 0; i < q.jac; i++) {
    ut('uP', 0, V.pres.read); ut('uDiv', 1, V.div); uf('uMul', i ? 1 : 0.85);
    draw(V.pres.write); V.pres.swap();
  }
  use(pv.grad); atlasU(); ut('uP', 0, V.pres.read); ut('uVel', 1, V.vel.read);
  draw(V.vel.write); V.vel.swap();
}

/* ------------------------------------------------------------------ */
/* Lighting state                                                     */
/* ------------------------------------------------------------------ */
const light = { x: 0.5, y: 0.5, level: 0.3 };
function updateLight(dt, emitters) {
  let tx = light.x, ty = light.y, lv = 0.3;
  if (!P.cursorLight) { tx = 0.5; ty = 1.05; lv = 0.75; }
  else if (emitters.length) { const e = emitters[emitters.length - 1]; tx = e.x / cssW; ty = 1 - e.y / cssH; lv = 1; }
  else if (hover) { tx = hover.x / cssW; ty = 1 - hover.y / cssH; lv = 0.6; }
  const k = 1 - Math.exp(-dt * 14), kl = 1 - Math.exp(-dt * 3);
  light.x += (tx - light.x) * k; light.y += (ty - light.y) * k;
  light.level += (lv - light.level) * kl;
}

/* ------------------------------------------------------------------ */
/* Render                                                             */
/* ------------------------------------------------------------------ */
function render(frame) {
  const [lmin, lmax] = life();

  // 1. Particles → additive HDR buffer (rgb: colour·weight, a: density)
  gl.bindFramebuffer(gl.FRAMEBUFFER, accum.fbo);
  gl.viewport(0, 0, accum.w, accum.h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (P.showParticles && P.particles > 0) {
    use(pr.points);
    ut('uState', 0, pstate.read); ui('uW', PW);
    uf('uLifeMin', lmin); uf('uLifeMax', lmax); uf('uPointSize', 1); uf('uCooling', 0.9 / P.life);
    uf('uWeight', P.particles * 0.3 * ((accum.w * accum.h) / 1.3e6) * (1048576 / N));
    uarr('uHot', 'uniform3fv', pal.hotFlat); uf('uCool', ...pal.cool);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(emptyVAO);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disable(gl.BLEND);
  }
  const dyeGain = P.showSmoke ? P.smoke : 0;

  // 2. Density field at lighting resolution, blurred twice for smooth billow normals
  use(pr.density);
  ut('uDye', 0, dye.read); ut('uAcc', 1, accum);
  uf('uAccTexel', accum.tx, accum.ty); uf('uDyeGain', dyeGain); uf('uPartGain', 1);
  draw(dens);
  use(pr.blur);
  ut('uSrc', 0, dens); uf('uDir', dens.tx, 0); draw(densTmp);
  ut('uSrc', 0, densTmp); uf('uDir', 0, dens.ty); draw(densBlur);
  ut('uSrc', 0, densBlur); uf('uDir', dens.tx * 2, 0); draw(densTmp);
  ut('uSrc', 0, densTmp); uf('uDir', 0, dens.ty * 2); draw(densBlur);

  // 3. Light: shadowed point light at the cursor + key light
  const lc = palColor(hue);
  const lp = light.level * P.light * 2.4;
  use(pr.light);
  ut('uDens', 0, densBlur); uf('uTexel', densBlur.tx, densBlur.ty);
  uf('uLight', light.x, light.y); uf('uLightZ', 0.12); uf('uFalloff', 6);
  uf('uAbsorb', 2.4 * P.shadows); uf('uAspect', aspect); uf('uNormal', 5 * P.shadows); uf('uSelf', 0.8 * P.shadows);
  uf('uFrameF', frame % 64);
  uf('uLightCol', lc[0] * lp, lc[1] * lp, lc[2] * lp);
  uf('uKeyCol', pal.key[0] * 0.22, pal.key[1] * 0.22, pal.key[2] * 0.22);
  draw(lightT);

  // 4. Composite into HDR scene
  use(pr.composite);
  ut('uDye', 0, dye.read); ut('uAcc', 1, accum); ut('uLightTex', 2, lightT); ut('uDens', 3, densBlur);
  uf('uDyeGain', dyeGain); uf('uPartGain', 1); uf('uScatter', 0.35); uf('uAspect', aspect);
  uf('uAir', 0.02 * light.level * P.light);
  uf('uBg0', ...pal.bg0); uf('uBg1', ...pal.bg1);
  uf('uLightCol', lc[0] * lp, lc[1] * lp, lc[2] * lp); uf('uLightPos', light.x, light.y);
  draw(scene);

  postFX(frame);
}

// Shared by both modes: scene → bloom → tonemapped screen
function postFX(frame) {
  // 5. Bloom: threshold → downsample chain → additive upsample
  const knee = 0.6, thr = 0.75;
  use(pr.bloomPre);
  ut('uSrc', 0, scene); uf('uTexel', scene.tx, scene.ty);
  uf('uCurve', thr - knee, knee * 2, 0.25 / knee); uf('uThreshold', thr);
  draw(bloomLv[0]);
  use(pr.bloomBox);
  for (let i = 1; i < bloomLv.length; i++) { ut('uSrc', 0, bloomLv[i - 1]); uf('uTexel', bloomLv[i - 1].tx, bloomLv[i - 1].ty); draw(bloomLv[i]); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = bloomLv.length - 1; i > 0; i--) { ut('uSrc', 0, bloomLv[i]); uf('uTexel', bloomLv[i].tx, bloomLv[i].ty); draw(bloomLv[i - 1]); }
  gl.disable(gl.BLEND);

  // 6. Tonemap to screen
  use(pr.final);
  ut('uScene', 0, scene); ut('uBloom', 1, bloomLv[0]);
  uf('uBloomInt', 0.16 * P.bloom); uf('uExposure', 1.0); uf('uAspect', aspect); uf('uFrameF', frame % 64);
  draw(null);
}

/* Volume mode render: ray-marched 3D smoke                           */
const V_CAM = 2.4;  // camera distance from the mid plane in screen heights (mild perspective)
const V_EXT = 9;   // extinction per unit density per screen height
// Sub-grid detail in the ray march: the density lookup is displaced by curl noise whose coordinates are advected
// with the flow (so it drifts, stretches and curls with the smoke), only in big, cooled billows.
// detail: overall strength; 0 = exactly the plain grid look (the detail passes are skipped).
// amp: displacement (cells), freq: noise cells per grid cell, flowT: period of each of the two noise phases (s),
// oct2: second octave weight, mod/erode: density modulation/erosion by the noise, dlo/dhi: local average density
// over which the detail fades in (big billows on, thin tendrils off), fast: speeds (cells/s) over which it fades out
// (jets), str: noise stretch (Jacobian norm, √3 = none) over which it fades out (finer than the march can sample).
// Sizes are in grid cells (the detail is sub-grid at every quality level, and the march steps one cell); speeds
// are for a 112-cell screen height and scale with the grid like the solver's own velocities.
const VT = { detail: 1, amp: 2.0, freq: 0.2, flowT: 1.2, oct2: 0.3, mod: 0.4, erode: 0, dlo: 0.04, dhi: 0.3, fast: [30, 60], str: [4.5, 8] };
const V_KEY = (() => { const k = [0.45, 0.85, 0.28], l = Math.hypot(...k); return k.map((v) => v / l); })();
function render3D(frame) {
  const V = vol3;
  const box = [V.X / V.Y / 2, 0.5, V.Z / V.Y / 2];

  // 1. Scalar atlas → TEXTURE_3D (hardware trilinear for the passes below), vMRT layers per draw
  use(pv.to3d);
  ut('uSrc', 0, V.scal.read); ui3('uG', V.X, V.Y, V.Z); ui('uCols', V.cols);
  for (const f of V.den3.fbos) { ui('uL0', f.z0); draw(f); }

  // 2. Light volume: point light at the emitter (its glow) + soft key light from above, both self-shadowed
  const hc = palColor(emitHue(hue));
  const lp = light.level * P.light * 1.6;
  const lc = [0, 1, 2].map((i) => (hc[i] + pal.ember[i]) * 0.5 * lp);
  use(pv.light);
  ut3('uDen', 5, V.den3);
  ui3('uLg', V.LX, V.LY, V.LZ); ui('uLc', V.LC); uf('uBox', ...box);
  uf('uLp', (light.x - 0.5) * aspect, light.y - 0.5, 0); uf('uLRad', emitRadius());
  uf('uFall', 26); uf('uExtL', V_EXT * 3.0 * P.shadows);
  const keyC = pal.keyC.map((v) => v * P.light);
  uf('uLcol', ...lc); uf('uKcol', ...keyC); uf('uKd', ...V_KEY);
  draw(V.lit);

  // 3. Detail: advect the two noise-coordinate phases by the simulated time, restarting a phase when its cycle wraps
  const det = VT.detail > 0 && !!V.crdA;
  // triangular phase weights (zero at each phase's restart), on the volume clock
  const ph = volT / VT.flowT, cyc = [Math.floor(ph), Math.floor(ph + 0.5)];
  const w0 = 1 - Math.abs(2 * (ph - cyc[0]) - 1), w1 = 1 - w0;
  if (det) {
    use(pv.crd); atlasU();
    ui3('uLg', V.LX, V.LY, V.LZ); ui('uLc', V.LC); uf('uLAtl', V.lit.tx, V.lit.ty);
    ut('uVel', 0, V.vel.read); ut3('uDen', 5, V.den3); uf('uDt', V.simDt);
    uf('uFast', VT.fast[0] * V.Y / 112, VT.fast[1] * V.Y / 112); uf('uStr', VT.str[0], VT.str[1]); uf('uPhW', w0, w1);
    // phase A, then phase B (which also measures the stretch of the new A)
    [V.crdA, V.crdB].forEach((pp, i) => {
      ut('uCrd', 1, pp.read); ut('uCrdO', 2, V.crdA.read); ui('uCh', i);
      uf('uReset', !V.cyc || V.cyc[i] !== cyc[i] ? 1 : 0);
      draw(pp.write); pp.swap();
    });
    V.cyc = cyc;
  } else V.cyc = null;
  V.simDt = 0;

  // 4. Ray march at reduced resolution
  use(det ? pv.marchD : pv.march);
  ut3('uDen', 5, V.den3);
  ut('uLit', 6, V.lit); ui3('uLg', V.LX, V.LY, V.LZ); ui('uLc', V.LC); uf('uLAtl', V.lit.tx, V.lit.ty);
  uf('uBox', ...box); uf('uCam', V_CAM); uf('uAspect', aspect); uf('uExt', V_EXT); uf('uStep', 1 / V.Y);
  uf('uFrameF', frame % 64); uf('uEmis', 2.5);
  uf('uHot', ...hc); uf('uEmb', ...pal.ember); uf('uAlb', ...pal.alb); uf('uTail', ...pal.tail);
  uf('uAmb', ...pal.amb.map((v) => v * P.light)); uf('uKcol', ...keyC);
  if (det) {
    // the phase weights renormalised, so the blend keeps its contrast
    const wn = 1 / Math.hypot(w0, w1);
    ut('uCrdA', 7, V.crdA.read); ut('uCrdB', 8, V.crdB.read); ut3('uNz', 9, vNoise);
    uf('uGc', V.X, V.Y, V.Z); uf('uPh', w0 * wn, w1 * wn);
    uf('uNo0', (cyc[0] * 0.137) % 1, (cyc[0] * 0.271) % 1, (cyc[0] * 0.419) % 1);
    uf('uNo1', (cyc[1] * 0.311 + 0.5) % 1, (cyc[1] * 0.173 + 0.5) % 1, (cyc[1] * 0.229 + 0.5) % 1);
    uf('uDetA', VT.detail * VT.amp); uf('uDetF', VT.freq / 16); uf('uDetF2', 2.13); uf('uOct2', VT.oct2);
    uf('uMod', VT.detail * VT.mod); uf('uErode', VT.detail * VT.erode); uf('uDLo', VT.dlo); uf('uDHi', VT.dhi);
  }
  draw(vMarchT);
  // unbind, so next frame's copy, light and detail passes never render into a texture that is still bound
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_3D, null);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, null);
  if (det) for (const u of [7, 8]) { gl.activeTexture(gl.TEXTURE0 + u); gl.bindTexture(gl.TEXTURE_2D, null); }

  // 5. Composite over the background into the HDR scene, then the shared bloom + tonemap
  use(pv.comp);
  ut('uMarch', 0, vMarchT); uf('uMTexel', vMarchT.tx, vMarchT.ty);
  uf('uAspect', aspect); uf('uAir', 0.02 * light.level * P.light);
  uf('uBg0', ...pal.bg0); uf('uBg1', ...pal.bg1);
  uf('uLightCol', ...lc); uf('uLightPos', light.x, light.y);
  draw(scene);

  postFX(frame);
}

function clearAll() {
  for (const d of [velocity, dye, pressure]) {
    for (const f of [d.read, d.write]) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.viewport(0, 0, f.w, f.h);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    }
  }
  initParticles();
  emitCarry = 0;
  clear3D();
}

/* ------------------------------------------------------------------ */
/* Loop                                                               */
/* ------------------------------------------------------------------ */
let last = performance.now(), time = 0, frame = 0, fpsEMA = 60, hudT = 0;
let volStepped = false; // this tick ran the volume solver (only those frames count for the governor)
// Volym's frame-rate governor: when the frame rate stays under VOL_FPS for 2 s, the volume grid steps down one
// QUALITY row (at most once per 3 s, never below Låg) and build3D resamples the scene into it. 3 s after a step
// down, and after at least 3 frames in the new grid, it checks that the frame rate rose by 10 %; if not, the grid
// was not what held it back (the browser caps requestAnimationFrame, e.g. at 30 Hz to save power, or another app
// loads the GPU), so the step is undone and it does not step down for 30 s, doubling with each such failure in a row
// (at most 4 min). The frame rate it had in the lower grid is then taken as a cap (gov.cap): until the frame rate
// stays 15 % over it for 2 s (the cap was lifted), slow means under 85 % of the cap and fast 95 % of it or more
// (never more than VOL_FPS and VOL_FPS_UP), so under a 30 Hz cap 30 fps counts as good and it does not probe the
// rows below again and again. A step down that helped keeps it out of the row it left for 20 s, doubling with each
// further drop from that row (at most 4 min), so it does not swing between two rows; after that, 5 s fast steps one
// row back up. Picking a quality starts over from that row, without a cap; a mode switch or resize restarts the
// timers (the frames around them are slow anyway), and a resize forgets the cap. Both frame rates in the check are
// frames per s over the last 2 s of whole frames, at least 3 (before the step: of the slow spell, so a slowdown
// earlier in a long spell cannot make a useless step look like a gain; after it: of the wait), as at 1–3 fps fpsEMA
// holds only the last frame or two. The clocks run in wall time, so the waits are the same at any frame rate; slow,
// fast and the cap's lift count at most 0.25 s a frame, so one hitch is not 2 s of slowness.
const VOL_FPS = 50, VOL_FPS_UP = 58;
function governVolume(el) {
  // el: the frame's length in s, 0 for the first frame after a pause. The count leaves out the first two frames
  // after a grid change, a resize or a frame that did not step the volume: their time is the old grid's last
  // frame, the resample or the frame in between.
  if (!volStepped || !el) { gov.slow = gov.fast = gov.n = gov.s = gov.fr.length = 0; gov.skip = 2; return; }
  const w = Math.min(el, 2), h = Math.min(el, 0.25);
  gov.t += w;
  gov.wait = Math.max(0, gov.wait - w);
  if (gov.skip) gov.skip--;
  else if (gov.wait <= 2) {
    // the count slides: the oldest frame drops out while the rest still span 2 s and are at least 3
    gov.n++; gov.s += el; gov.fr.push(el);
    while (gov.fr.length > 3 && gov.s - gov.fr[0] >= 2) { gov.s -= gov.fr.shift(); gov.n--; }
  }
  if (gov.fps0 && !gov.wait && gov.n >= 3) {
    if (gov.n / gov.s < gov.fps0 * 1.1) {
      volDrop--; gov.hold = gov.t + Math.min(240, 30 * 2 ** gov.fails++); gov.wait = 3; qualityLabels();
      gov.cap = gov.n / gov.s; gov.lift = 0; // a rate the grid did not limit
      gov.n = gov.s = gov.fr.length = 0; gov.skip = 2;
    } else {
      // kept: the count goes on, its frames are this grid's
      gov.fails = 0; gov.ban[gov.r0] = gov.t + Math.min(240, 20 * 2 ** gov.drops[gov.r0]++);
    }
    gov.fps0 = 0;
  }
  if (gov.cap) { gov.lift = fpsEMA > 1.15 * gov.cap ? gov.lift + h : 0; if (gov.lift >= 2) gov.cap = 0; }
  const lo = gov.cap ? Math.min(VOL_FPS, 0.85 * gov.cap) : VOL_FPS, up = gov.cap ? Math.min(VOL_FPS_UP, 0.95 * gov.cap) : VOL_FPS_UP;
  if (fpsEMA < lo) { gov.slow += h; gov.fast = 0; }
  else {
    gov.slow = 0; gov.fast = fpsEMA >= up ? gov.fast + h : 0;
    if (!gov.fps0) gov.n = gov.s = gov.fr.length = 0; // the count for a step down covers the slow spell only
  }
  if (gov.wait || gov.fps0) return;
  const r = QKEYS.indexOf(volLevel());
  if (gov.slow >= 2 && gov.n >= 3 && gov.t >= gov.hold && r > 0) {
    volDrop++; gov.fps0 = gov.n / gov.s; gov.r0 = r;
  } else if (gov.fast >= 5 && volDrop > 0 && gov.t >= gov.ban[r + 1]) {
    volDrop--;
  } else return;
  gov.slow = gov.fast = gov.n = gov.s = gov.fr.length = 0; gov.skip = 2; gov.wait = 3;
  qualityLabels();
}
function tick(dt) {
  resize(false);
  volSettle = Math.max(0, volSettle - dt);
  if (!P.paused) { time += dt; updateDemo(dt); }
  const emitters = gather(dt, time);
  updateLight(dt, emitters);
  // Volym builds its targets on demand (so setting krakatoaDebug.P.mode directly also works). When they cannot
  // be built for this window, the window is a sliver or it is still being resized, it shows its last state,
  // frozen, and never falls back to the particle scene.
  const volMode = P.mode === 'volume' && volOK;
  const vol = volMode && build3D();
  volStepped = false;
  if (!P.paused && vol === volMode) {
    // Each mode simulates only its own scene; the other one stays as it was until you switch back
    if (segN) { hue += dt * 0.035; if (!vol) splat(); }
    if (vol) { step3D(dt, time); volStepped = true; }
    else {
      step(dt, time);
      updateParticles(dt, time, frame);
    }
  } else {
    segN = 0;
  }
  if (!volMode) render(frame);
  else if (vol3) render3D(frame);
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  frame++;
}
function loop(now) {
  requestAnimationFrame(loop);
  const el = (now - last) / 1000;
  const dt = Math.min(Math.max(el, 0.001), 1 / 30);
  last = now;
  tick(dt);
  // frame rate averaged over wall time (0.4 s), not over frames: it is as current at 1 fps as at 60, and each
  // frame weighs by its length, so alternating 16.7 and 33.3 ms frames read 40, the frames actually shown per s.
  // A lone gap of 5 s or more, or the first frame after the tab was hidden, is a pause, not a frame (gap 0); two
  // such gaps in a row are this machine's frame time, so a very slow GPU still counts (and the HUD keeps up).
  const raw = loop.prev ? now - loop.prev : 0;
  const gap = raw && (raw < 5000 || loop.long) ? Math.max(raw, 1) / 1000 : 0;
  loop.long = raw >= 5000;
  loop.prev = now;
  if (gap) fpsEMA += (1 / gap - fpsEMA) * (1 - Math.exp(-gap / 0.4));
  governVolume(gap);
  if ((hudT += Math.min(gap, 2)) > 0.5) {
    hudT = 0;
    $('hudFps').textContent = fpsEMA < 9.95 ? fpsEMA.toFixed(1).replace('.', ',') : Math.round(fpsEMA);
  }
}
document.addEventListener('visibilitychange', () => { loop.prev = 0; });
// Test hook: advance the simulation a fixed number of frames synchronously, independent of
// requestAnimationFrame throttling. krakatoaDebug.run(240) = 4 s of autopilot at 60 fps.
// krakatoaDebug.setMode('particles' | 'volume') switches mode like the panel does.
window.krakatoaDebug = {
  P,
  run(frames = 240, dt = 1 / 60) { for (let i = 0; i < frames; i++) tick(dt); return frame; },
  setMode: (m) => setMode(m),
  VT, // sub-grid detail settings for Volym, read every frame (VT.detail = 0: the plain march)
  get volumeOK() { return volOK; },
  get grid3D() { return vol3 ? [vol3.X, vol3.Y, vol3.Z, vol3.AW, vol3.AH] : null; },
  get volQuality() { return volLevel(); }, // the QUALITY row Volym runs (the select minus the governor's steps)
  get detailOK() { return !!(vol3 && vol3.crdA); }, // the current grid has its detail atlases
};

canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fail('Grafikkontexten tappades. Ladda om sidan för att starta igen.'); });

/* UI                                                                 */

function setPalette(i) {

}
// A swatch shows the colours the current mode uses, from emission to the oldest smoke. Partiklar: the hot cycle
// into the cool colour. Volym: its emission band (hot[0] ↔ hot[3], see emitHue), the ember glow, then the albedo
// of cooled and of the oldest smoke.
function swatchBg(p) {

    ? `linear-gradient(110deg, ${p.hot[0]} 0%, ${p.hot[3]} 22%, ${p.ember} 45%, ${p.smoke} 72%, ${p.tail} 100%)`
    : `linear-gradient(110deg, ${p.hot[0]} 0%, ${p.hot[1]} 30%, ${p.hot[2]} 55%, ${p.cool} 100%)`;
}

PALETTES.forEach((p, i) => {

paintSwatches();

const qSel = $('quality');
for (const [k, q] of Object.entries(QUALITY)) {
  if (q.pw > maxTex || q.ph > maxTex) continue;
  const o = document.createElement('option');
  o.value = k;
  o.textContent = `${q.label} · ${(q.pw * q.ph / 1e6).toFixed(q.pw * q.ph < 1e6 ? 2 : 1).replace('.', ',')} M partiklar`;
  qSel.appendChild(o);
}
const qLabels = [...qSel.options].map((o) => o.textContent);
// Volym lists the 3D grid each quality gives for the current window shape instead of the particle count, and
// says when the frame-rate governor runs a lower row than the one selected (the HUD shows the grid it runs)
function qualityLabels() {
  const vol = P.mode === 'volume';
  [...qSel.options].forEach((o, i) => {
    const g = vol && cssW ? grid3D(o.value) : null;
    o.textContent = g ? `${QUALITY[o.value].label} · ${g.X}×${g.Y}×${g.Z}` : qLabels[i];
  });
  const info = $('qualityInfo'), lowered = vol && volLevel() !== P.quality;
  info.textContent = lowered ? 'sänkt till ' + QUALITY[volLevel()].label : '';
  info.title = lowered ? 'Bildfrekvensen var för låg, så Volym kör ett grövre 3D-grid än det valda' : '';
}
qSel.value = P.quality;
qSel.addEventListener('change', () => {
  P.quality = qSel.value;
  volDrop = 0;
  Object.assign(gov, { slow: 0, fast: 0, wait: 0, fps0: 0, hold: 0, fails: 0, n: 0, s: 0, skip: 2, cap: 0 }); gov.fr.length = 0; gov.drops.fill(0); gov.ban.fill(0);
  buildSim(); buildParticles(); buildScreen();
  qualityLabels();
});

// Läge: Partiklar (fine additive particle smoke) / Volym (ray-marched 3D smoke solver). The 3D targets are built
// on the first volume frame and kept afterwards, so switching back and forth keeps both scenes.
const MODES = [['particles', 'mode-particles'], ['volume', 'mode-volume']];
function setMode(m) {
  if (m !== 'volume' || !volOK) m = 'particles';
  // each mode has its own autopilot path: re-seed the brush on the new one, so it never strokes across the screen
  if (m !== P.mode) demo.on = false;
  P.mode = m;
  try { localStorage.setItem('krakatoa.mode', m); } catch (_) { /* storage is optional */ }
  const vol = m === 'volume';
  const prevFocus = document.activeElement;
  for (const [val, id] of MODES) $(id).setAttribute('aria-pressed', String(m === val));
  $('g-volume').hidden = !vol;
  // controls that only affect the particle renderer
  for (const id of ['s-smoke', 's-particles']) $(id).parentElement.hidden = vol;
  for (const id of ['t-showSmoke', 't-showParticles']) $(id).closest('label').hidden = vol;
  $('hudPartBox').hidden = vol;
  $('hudPartSep').hidden = vol;
  // M on a control that this mode hides: keep keyboard focus in the panel, on the button of the mode now shown
  if (prevFocus && panel.contains(prevFocus) && !prevFocus.getClientRects().length) $(vol ? 'mode-volume' : 'mode-particles').focus();
  if (sliderSync.life) sliderSync.life();
  gov.slow = gov.fast = gov.n = gov.s = gov.fr.length = 0; gov.skip = 2;
  if (gov.fps0) gov.wait = 3;
  updateGridHud();
  qualityLabels();
  paintSwatches();
}
for (const [val, id] of MODES) $(id).addEventListener('click', () => setMode(val));
if (!volOK) { $('mode-volume').disabled = true; $('mode-volume').title = 'Volymläget stöds inte av den här grafikdrivern'; }

for (const [group, defs] of Object.entries(SLIDERS)) {
  const g = $(group);
  for (const [key, label, min, max, stepv, fmt] of defs) {
    const row = document.createElement('div');
    row.className = 'slider';
    const id = 's-' + key;
    row.innerHTML = `<label for="${id}">${label}</label><output for="${id}"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${stepv}">`;
    const input = row.querySelector('input'), out = row.querySelector('output');
    const sync = () => {
      out.textContent = fmt(P[key]);
      input.style.setProperty('--fill', ((P[key] - min) / (max - min)) * 100 + '%');
    };
    input.value = P[key];
    input.addEventListener('input', () => { P[key] = parseFloat(input.value); sync(); });
    sync();
    sliderSync[key] = sync;
    g.appendChild(row);
  }
}

function setToggle(key, val) {
  P[key] = val;
  const el = $('t-' + key);
  if (el) el.checked = val;
  if (key === 'auto' && val) demo.t = 0;
}
for (const key of ['showSmoke', 'showParticles', 'cursorLight', 'auto']) {
  const el = $('t-' + key);
  el.checked = P[key];
  el.addEventListener('change', () => setToggle(key, el.checked));
}

const pauseBtn = $('btnPause');
function togglePause() {
  P.paused = !P.paused;
  pauseBtn.firstChild.textContent = P.paused ? 'Fortsätt ' : 'Pausa ';
}
pauseBtn.addEventListener('click', togglePause);
$('btnClear').addEventListener('click', clearAll);

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  // Focused controls keep Space/Enter and their own keys; the letter and digit shortcuts still apply
  const ctl = e.target.closest && e.target.closest('input, select, textarea, button');
  if (ctl && (e.code === 'Space' || e.key === 'Enter' || !/^[mhca1-5]$/i.test(e.key))) return;
  if (ctl && ctl.tagName === 'SELECT') e.preventDefault(); // stop type-ahead, e.g. M selecting "Medel"
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'c' || e.key === 'C') clearAll();
  else if (e.key === 'h' || e.key === 'H') setPanel(panel.hidden);
  else if (e.key === 'a' || e.key === 'A') setToggle('auto', !P.auto);
  else if (e.key === 'm' || e.key === 'M') setMode(P.mode === 'volume' ? 'particles' : 'volume');
  else if (/^[1-5]$/.test(e.key)) setPalette(+e.key - 1);
});

/* ------------------------------------------------------------------ */
setPalette(P.palette);
resize(true);
let startMode = P.mode;
try { const m = localStorage.getItem('krakatoa.mode'); if (m === 'volume' || m === 'particles') startMode = m; } catch (_) { /* storage is optional */ }
if (/^#volym$/i.test(location.hash)) startMode = 'volume';
else if (/^#partiklar$/i.test(location.hash)) startMode = 'particles';
setMode(startMode);
window.addEventListener('hashchange', () => {
  if (/^#volym$/i.test(location.hash)) setMode('volume');
  else if (/^#partiklar$/i.test(location.hash)) setMode('particles');
});
requestAnimationFrame((t) => { last = t; loop(t); });
})();
</script>
</body>
</html>
